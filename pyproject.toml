[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "call-secretary"
version = "0.1.0.dev0"
description = "Private family call secretary with durable Telegram reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML==6.0.2", "httpx==0.28.1", "websockets==15.0.1", "tzdata==2025.2",
]

[project.optional-dependencies]
audio = ["sounddevice==0.5.3"]
modem = ["pyserial==3.5"]
dev = [
  "pytest==8.4.1", "pytest-cov==6.2.1", "coverage==7.10.6",
  "ruff==0.12.11", "mypy==1.17.1",
]

[project.scripts]
call-secretary = "call_secretary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/call_secretary"]
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/call_secretary"]

[[tool.mypy.overrides]]
module = ["yaml", "sounddevice", "serial", "serial.*"]
ignore_missing_imports = true

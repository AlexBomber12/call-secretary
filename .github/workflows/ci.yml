name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/ci.py
      - if: runner.os == 'Linux'
        run: |
          bash -n deploy/install-server.sh
          bash -n deploy/activate-release.sh
          bash -n tests/deployment-smoke.sh
      - if: runner.os == 'Linux'
        name: Deployment smoke in disposable Linux container
        run: docker run --rm -e CALL_SECRETARY_CONTAINER_TEST=1 -v "$PWD:/source:ro" ubuntu:24.04 bash /source/tests/deployment-smoke.sh
